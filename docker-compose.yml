# Полная конфигурация для всей системы: Bot + WebApp + Database
services:
  # PostgreSQL база данных для поддержки
  postgres:
    image: postgres:15-alpine
    container_name: telegram-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-telegram_bot}
      POSTGRES_USER: ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./telegram-bot/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./telegram-bot/database/migrations/005_realtime_triggers.sql:/docker-entrypoint-initdb.d/02-realtime-triggers.sql
      - ./telegram-bot/database/migrations/006_add_last_activity.sql:/docker-entrypoint-initdb.d/03-add-last-activity.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Telegram Bot (Python + aiogram)
  bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bot Configuration
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telegram_bot}
      DB_USER: ${DB_USER:-botuser}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      
      # Google Sheets Configuration
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google-credentials.json
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      
      # FSM Storage Configuration
      FSM_STORAGE_TYPE: ${FSM_STORAGE_TYPE:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      
      # Sync Configuration
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      USE_POSTGRES: ${USE_POSTGRES:-true}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_MAX_RETRIES: ${SYNC_MAX_RETRIES:-3}
    volumes:
      # Монтируем credentials для Google Sheets (read-only)
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./credentials/google-credentials.json}:/app/credentials/google-credentials.json:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Server (FastAPI)
  api-server:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-api-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "start_api_server.py"]
    environment:
      # Bot Configuration (нужен для config.py, но не используется)
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telegram_bot}
      DB_USER: ${DB_USER:-botuser}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      
      # Google Sheets Configuration
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google-credentials.json
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      
      # Database Pool Configuration
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-15}
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}
    volumes:
      # Монтируем credentials для Google Sheets (read-only)
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./credentials/google-credentials.json}:/app/credentials/google-credentials.json:ro
    ports:
      - "5000:5000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Sync Worker (синхронизация Google Sheets -> PostgreSQL)
  sync-worker:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-sync-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "sync_worker.py"]
    environment:
      # Bot Configuration (нужен для config.py, но не используется)
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telegram_bot}
      DB_USER: ${DB_USER:-botuser}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      
      # Google Sheets Configuration
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google-credentials.json
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      
      # Sync Configuration
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      USE_POSTGRES: ${USE_POSTGRES:-true}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_MAX_RETRIES: ${SYNC_MAX_RETRIES:-3}
      
      # Database Pool Configuration
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-15}
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}
    volumes:
      # Монтируем credentials для Google Sheets (read-only)
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./credentials/google-credentials.json}:/app/credentials/google-credentials.json:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js WebApp (WebApp + Admin Panel)
  webapp:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
        NEXT_PUBLIC_USE_POSTGRES_REALTIME: ${NEXT_PUBLIC_USE_POSTGRES_REALTIME:-true}
    container_name: telegram-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Next.js Configuration
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      
      # Bot Configuration
      BOT_TOKEN: ${BOT_TOKEN}
      NEXT_PUBLIC_WEBAPP_URL: ${WEBAPP_URL:-http://localhost:3000}
      
      # Database Configuration (для Supabase или прямого подключения)
      DATABASE_URL: postgresql://${DB_USER:-botuser}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-telegram_bot}
      
      # PostgreSQL переменные для DatabaseClient
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME:-telegram_bot}
      POSTGRES_USER: ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      
      # Supabase Configuration (если используется)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      
      # Realtime Configuration
      NEXT_PUBLIC_USE_POSTGRES_REALTIME: ${NEXT_PUBLIC_USE_POSTGRES_REALTIME:-true}
      
      # Google Sheets Configuration
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google-credentials.json
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      
      # Backend API Configuration
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api-server:5000}
      
      # NextAuth Configuration
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      
      # JWT Authentication Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-24}
      
      # Rate Limiting Configuration
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-5}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
    volumes:
      # Монтируем credentials для Google Sheets (read-only)
      - ${GOOGLE_CREDENTIALS_HOST_PATH:-./credentials/google-credentials.json}:/app/credentials/google-credentials.json:ro
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (опционально, для FSM storage бота)
  redis:
    image: redis:7-alpine
    container_name: telegram-system-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles:
      - redis  # Запускается только при явном указании профиля: docker-compose --profile redis up

# Volumes для персистентности данных
volumes:
  postgres_data:
    driver: local
    name: telegram_system_postgres_data
  redis_data:
    driver: local
    name: telegram_system_redis_data

# Изолированная сеть для всех сервисов
networks:
  app-network:
    driver: bridge
    name: telegram_system_network
