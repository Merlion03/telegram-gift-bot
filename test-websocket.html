<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        .log-entry.error {
            background: #ffebee;
            color: #c62828;
        }
        .log-entry.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .log-entry.info {
            background: #e3f2fd;
            color: #1565c0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            width: 300px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    
    <div>
        <label>WebSocket URL:</label><br>
        <input type="text" id="wsUrl" value="ws://localhost:3000/api/realtime?token=test-token">
    </div>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendMessage()">Send Test Message</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div>
        <strong>Connection Status:</strong> <span id="status">Disconnected</span>
    </div>
    
    <h3>Log:</h3>
    <div id="log" class="log"></div>

    <script>
        let ws = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toISOString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        function connect() {
            const url = document.getElementById('wsUrl').value;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'error');
                return;
            }
            
            log(`Connecting to ${url}...`, 'info');
            updateStatus('Connecting...');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = (event) => {
                    log('WebSocket connection opened!', 'success');
                    updateStatus('Connected');
                    log(`ReadyState: ${ws.readyState}`, 'info');
                };
                
                ws.onmessage = (event) => {
                    log(`Received message: ${event.data}`, 'success');
                    
                    try {
                        const data = JSON.parse(event.data);
                        log(`Parsed message type: ${data.type}`, 'info');
                    } catch (e) {
                        log(`Failed to parse message: ${e.message}`, 'error');
                    }
                };
                
                ws.onerror = (event) => {
                    log(`WebSocket error occurred`, 'error');
                    console.error('WebSocket error:', event);
                };
                
                ws.onclose = (event) => {
                    log(`WebSocket closed: code=${event.code}, reason=${event.reason || 'No reason'}`, 'error');
                    updateStatus('Disconnected');
                    ws = null;
                };
                
            } catch (error) {
                log(`Failed to create WebSocket: ${error.message}`, 'error');
                updateStatus('Error');
            }
        }
        
        function disconnect() {
            if (!ws) {
                log('Not connected', 'error');
                return;
            }
            
            log('Closing connection...', 'info');
            ws.close(1000, 'User requested disconnect');
        }
        
        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected', 'error');
                return;
            }
            
            const message = {
                type: 'subscribe',
                channel: 'all_messages',
                subscriptionId: 'test-sub-' + Date.now()
            };
            
            log(`Sending message: ${JSON.stringify(message)}`, 'info');
            ws.send(JSON.stringify(message));
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Auto-connect on load (optional)
        // connect();
    </script>
</body>
</html>
