<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Connection Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 3px;
        }
        .log-info { color: #0066cc; }
        .log-success { color: #00aa00; }
        .log-error { color: #cc0000; }
        .log-warning { color: #ff8800; }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .status-connecting { background: #fff3cd; color: #856404; }
        .status-connected { background: #d4edda; color: #155724; }
        .status-disconnected { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Fix Test</h1>
    <p>Этот тест проверяет исправление проблемы с немедленным закрытием WebSocket соединения (код 1006)</p>
    
    <div id="status" class="status status-disconnected">Статус: Отключено</div>
    
    <div>
        <button onclick="testConnection()">Тест подключения</button>
        <button onclick="clearLog()">Очистить лог</button>
    </div>
    
    <div class="log" id="log"></div>

    <script>
        let ws = null;
        let connectionState = 'disconnected';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(state) {
            connectionState = state;
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status status-${state}`;
            
            const statusText = {
                'disconnected': 'Отключено',
                'connecting': 'Подключение...',
                'connected': 'Подключено'
            };
            
            statusDiv.textContent = `Статус: ${statusText[state] || state}`;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function getToken() {
            try {
                const response = await fetch('/api/auth/ws-token');
                if (response.ok) {
                    const data = await response.json();
                    return data.token;
                }
                log('Ошибка получения токена: ' + response.status, 'error');
                return null;
            } catch (error) {
                log('Ошибка получения токена: ' + error.message, 'error');
                return null;
            }
        }
        
        async function testConnection() {
            log('=== НАЧАЛО ТЕСТА ===', 'info');
            
            // Закрываем предыдущее соединение, если есть
            if (ws) {
                log('Закрываем предыдущее соединение', 'info');
                ws.close();
                ws = null;
            }
            
            updateStatus('connecting');
            log('Получаем токен аутентификации...', 'info');
            
            const token = await getToken();
            if (!token) {
                log('Не удалось получить токен', 'error');
                updateStatus('disconnected');
                return;
            }
            
            log('Токен получен (длина: ' + token.length + ' символов)', 'success');
            
            // Создаём WebSocket соединение
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/realtime?token=${encodeURIComponent(token)}`;
            
            log('Создаём WebSocket соединение...', 'info');
            log('URL: ' + wsUrl.replace(/token=[^&]+/, 'token=***'), 'info');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('✅ WebSocket OPEN event', 'success');
                log('readyState: ' + ws.readyState + ' (1=OPEN)', 'info');
            };
            
            ws.onmessage = (event) => {
                log('📨 Получено сообщение: ' + event.data, 'info');
                
                try {
                    const message = JSON.parse(event.data);
                    
                    if (message.type === 'connected') {
                        log('✅ Получено подтверждение подключения от сервера!', 'success');
                        log('ClientID: ' + message.clientId, 'info');
                        updateStatus('connected');
                        
                        // Отправляем тестовое subscribe сообщение
                        log('Отправляем тестовое subscribe сообщение...', 'info');
                        ws.send(JSON.stringify({
                            type: 'subscribe',
                            channel: 'session_messages',
                            sessionId: 1,
                            subscriptionId: 'test_sub_' + Date.now()
                        }));
                    } else if (message.type === 'subscription_confirmed') {
                        log('✅ Подписка подтверждена!', 'success');
                        log('Channel: ' + message.channel, 'info');
                    } else {
                        log('Получено сообщение типа: ' + message.type, 'info');
                    }
                } catch (error) {
                    log('Ошибка парсинга сообщения: ' + error.message, 'error');
                }
            };
            
            ws.onerror = (event) => {
                log('❌ WebSocket ERROR event', 'error');
                log('Error: ' + JSON.stringify(event), 'error');
            };
            
            ws.onclose = (event) => {
                log('🔴 WebSocket CLOSE event', 'warning');
                log('Code: ' + event.code, 'warning');
                log('Reason: ' + (event.reason || 'нет причины'), 'warning');
                log('wasClean: ' + event.wasClean, 'warning');
                
                if (event.code === 1006) {
                    log('⚠️ Код 1006 = Abnormal Closure (соединение закрылось без Close frame)', 'error');
                }
                
                updateStatus('disconnected');
                log('=== ТЕСТ ЗАВЕРШЁН ===', 'info');
            };
        }
    </script>
</body>
</html>
