<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test с Аутентификацией</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        .log-entry.error {
            background: #ffebee;
            color: #c62828;
        }
        .log-entry.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .log-entry.info {
            background: #e3f2fd;
            color: #1565c0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            width: 300px;
            margin: 5px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>WebSocket Test с Аутентификацией</h1>
    
    <div class="section">
        <h3>Шаг 1: Получить токен</h3>
        <p>Сначала нужно получить токен аутентификации от сервера</p>
        <button onclick="getToken()">Получить токен</button>
        <div>
            <strong>Токен:</strong> <span id="tokenDisplay">Не получен</span>
        </div>
    </div>
    
    <div class="section">
        <h3>Шаг 2: Подключиться к WebSocket</h3>
        <div>
            <label>WebSocket URL:</label><br>
            <input type="text" id="wsUrl" value="ws://localhost:3000/api/realtime" readonly>
        </div>
        
        <div>
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <button onclick="sendSubscribe()">Subscribe to All Messages</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
        
        <div>
            <strong>Connection Status:</strong> <span id="status">Disconnected</span>
        </div>
    </div>
    
    <h3>Log:</h3>
    <div id="log" class="log"></div>

    <script>
        let ws = null;
        let authToken = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toISOString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        async function getToken() {
            log('Запрос токена от /api/auth/ws-token...', 'info');
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/ws-token', {
                    method: 'GET',
                    credentials: 'include', // Важно для отправки cookies
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.token) {
                    authToken = data.token;
                    document.getElementById('tokenDisplay').textContent = authToken.substring(0, 50) + '...';
                    log(`Токен получен успешно! Длина: ${authToken.length} символов`, 'success');
                } else {
                    throw new Error('Токен не найден в ответе');
                }
                
            } catch (error) {
                log(`Ошибка получения токена: ${error.message}`, 'error');
                log('Убедитесь что вы авторизованы на http://localhost:3000/login', 'error');
            }
        }
        
        function connect() {
            if (!authToken) {
                log('Сначала получите токен!', 'error');
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'error');
                return;
            }
            
            const baseUrl = document.getElementById('wsUrl').value;
            const url = `${baseUrl}?token=${encodeURIComponent(authToken)}`;
            
            log(`Connecting to ${baseUrl}...`, 'info');
            updateStatus('Connecting...');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = (event) => {
                    log('WebSocket connection opened!', 'success');
                    updateStatus('Connected');
                    log(`ReadyState: ${ws.readyState}`, 'info');
                };
                
                ws.onmessage = (event) => {
                    log(`Received message: ${event.data}`, 'success');
                    
                    try {
                        const data = JSON.parse(event.data);
                        log(`Message type: ${data.type}`, 'info');
                        
                        if (data.type === 'connected') {
                            log(`Client ID: ${data.clientId}`, 'info');
                        }
                    } catch (e) {
                        log(`Failed to parse message: ${e.message}`, 'error');
                    }
                };
                
                ws.onerror = (event) => {
                    log(`WebSocket error occurred`, 'error');
                    console.error('WebSocket error:', event);
                };
                
                ws.onclose = (event) => {
                    log(`WebSocket closed: code=${event.code}, reason=${event.reason || 'No reason'}`, 'error');
                    updateStatus('Disconnected');
                    ws = null;
                };
                
            } catch (error) {
                log(`Failed to create WebSocket: ${error.message}`, 'error');
                updateStatus('Error');
            }
        }
        
        function disconnect() {
            if (!ws) {
                log('Not connected', 'error');
                return;
            }
            
            log('Closing connection...', 'info');
            ws.close(1000, 'User requested disconnect');
        }
        
        function sendSubscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected', 'error');
                return;
            }
            
            const message = {
                type: 'subscribe',
                channel: 'all_messages',
                subscriptionId: 'test-sub-' + Date.now()
            };
            
            log(`Sending subscribe: ${JSON.stringify(message)}`, 'info');
            ws.send(JSON.stringify(message));
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
